[project]
name = "project-5"
version = "0.1.0"
description = ""
authors = [
    {name = "Ilonchik",email = "ilonafedulova91@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0,<6.1)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "django-filter (>=26.2,<27.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "coverage (>=7.16.2,<8.0.0)",
    "ruff (>=0.17.1,<0.18.0)"
]
lint = [
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["ALL"]